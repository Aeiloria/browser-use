name: docker

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - stable
      - 'releases/**'
    tags:
      - '*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_publish_image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags based on tag/branch
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            browseruse/browseruse
            ghcr.io/browser-use/browser-use
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=sha

      - name: Report deploy start to Rollouts
        id: rollouts
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CHANGE_MONITOR_ENV: build_publish_image
          CHANGE_MONITOR_SERVICE: browser-use
          DEPLOY_VERSION: ${{ github.sha }}
          CHANGE_MONITOR_ACTOR: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .github/scripts/rollouts-reporter.sh bootstrap
          bash .github/scripts/rollouts-reporter.sh start
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=browseruse/browseruse:buildcache
          cache-to: type=registry,ref=browseruse/browseruse:buildcache,mode=max
      - name: Report deploy finish to Rollouts
        if: always()
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CHANGE_MONITOR_ENV: build_publish_image
          CHANGE_MONITOR_SERVICE: browser-use
          DEPLOY_VERSION: ${{ github.sha }}
          CHANGE_MONITOR_ACTOR: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ROLLOUTS_DEPLOYMENT: ${{ steps.rollouts.outputs.deployment }}
          ROLLOUTS_OUTCOME: ${{ steps.push.outcome }}
        run: bash .github/scripts/rollouts-reporter.sh finish
